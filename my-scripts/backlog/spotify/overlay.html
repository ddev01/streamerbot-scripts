<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOTIFY &amp; SB v2 Style 4 - 1.0.1</title>
  <script src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      font-family: Arial, sans-serif;
    }

    #info {
      width: 300px;
      padding: 6px;
      background: rgba(0, 114, 255, 0.49);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      opacity: 1;
      transition: opacity 0.8s ease;
    }

    body.hide #info {
      opacity: 0;
      pointer-events: none;
    }

    #info img {
      width: 16px;
      height: 16px;
      margin-right: 8px;
    }

    #info span {
      color: white;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div id="info" style="display:flex; align-items:center; justify-content:center; gap: 8px;">
    <?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 512" width="24" height="24">
  <path fill="#1ed760" d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8Z"/>
  <path d="M406.6 231.1c-5.2 0-8.4-1.3-12.9-3.9-71.2-42.5-198.5-52.7-280.9-29.7-3.6 1-8.1 2.6-12.9 2.6-13.2 0-23.3-10.3-23.3-23.6 0-13.6 8.4-21.3 17.4-23.9 35.2-10.3 74.6-15.2 117.5-15.2 73 0 149.5 15.2 205.4 47.8 7.8 4.5 12.9 10.7 12.9 22.6 0 13.6-11 23.3-23.2 23.3zm-31 76.2c-5.2 0-8.7-2.3-12.3-4.2-62.5-37-155.7-51.9-238.6-29.4-4.8 1.3-7.4 2.6-11.9 2.6-10.7 0-19.4-8.7-19.4-19.4s5.2-17.8 15.5-20.7c27.8-7.8 56.2-13.6 97.8-13.6 64.9 0 127.6 16.1 177 45.5 8.1 4.8 11.3 11 11.3 19.7-.1 10.8-8.5 19.5-19.4 19.5zm-26.9 65.6c-4.2 0-6.8-1.3-10.7-3.6-62.4-37.6-135-39.2-206.7-24.5-3.9 1-9 2.6-11.9 2.6-9.7 0-15.8-7.7-15.8-15.8 0-10.3 6.1-15.2 13.6-16.8 81.9-18.1 165.6-16.5 237 26.2 6.1 3.9 9.7 7.4 9.7 16.5s-7.1 15.4-15.2 15.4z"/>
</svg>
    <span id="text"></span>
  </div>
  <script>
    const params = new URLSearchParams(location.search),
      address = params.get('address') || '127.0.0.1',
      port = parseInt(params.get('port') || '8080', 10),
      password = params.get('password') || '';

    function getBoolParam(name, def=false){
      const v = params.get(name);
      if (v==null) return def;
      return /^(1|true|yes|on)$/i.test(String(v).trim());
    }
    const autoHide = getBoolParam('autoHide', false);
    const songChangeOnly = getBoolParam('songChangeOnly', false);
    const PROGRESS_BACK_TOLERANCE = 1500;

    const infoText = document.getElementById('text');

    function sanitize(s) {
      return s.length > 50 ? s.slice(0, 50).trim() + '...' : s;
    }

    function showOverlay() {
      document.body.classList.remove('hide');
    }
    function hideOverlay() {
      document.body.classList.add('hide');
    }

    let prevIsPlaying = null,
        prevProgressMs = null,
        prevTrackId = null;
    let songRevealTimer = null,
        songHideTimer = null;

    function clearSongChangeTimers(){
      if (songRevealTimer){ clearTimeout(songRevealTimer); songRevealTimer=null; }
      if (songHideTimer){ clearTimeout(songHideTimer); songHideTimer=null; }
    }
    function scheduleSongChangeWindow(){
      clearSongChangeTimers();
      hideOverlay();
      songRevealTimer = setTimeout(()=>{
        showOverlay();
        songHideTimer = setTimeout(()=>{
          hideOverlay();
        },10000);
      },5000);
    }

    function onData(d) {
      const s = d.songInfo;
      infoText.textContent = sanitize(s.trackName + ' – ' + s.artists);

      if (songChangeOnly) {
        const progressWentBack = (prevProgressMs != null) && (s.progressMs + PROGRESS_BACK_TOLERANCE < prevProgressMs);
        const trackChanged = (prevTrackId != null) && (s.trackId !== prevTrackId);
        if (trackChanged || progressWentBack) {
          scheduleSongChangeWindow();
        }
      } else if (autoHide) {
        if (prevIsPlaying !== null && prevIsPlaying !== s.isPlaying) {
          if (s.isPlaying) {
            showOverlay();
          } else {
            hideOverlay();
          }
        }
      } else {
        showOverlay();
      }

      prevIsPlaying = s.isPlaying;
      prevProgressMs = s.progressMs;
      prevTrackId = s.trackId;
    }

    const client = new StreamerbotClient({
      address,
      port,
      password,
      endpoint: '/',
      autoReconnect: true,
      immediate: true,
      onConnect: () => {
        if (songChangeOnly) {
          hideOverlay();
        } else {
          showOverlay();
        }
      }
    });

    client.on('Misc.GlobalVariableUpdated', ({ data }) => {
      if (data.name === 'tawmae_SPOTIFY_AND_SB_INFO') {
        try {
          onData(typeof data.newValue === 'string' ? JSON.parse(data.newValue) : data.newValue);
        } catch {}
      }
    });
  </script>


</body></html>
